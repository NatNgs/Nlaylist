<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<link rel="icon" href="rsc/nlaylist.svg">
		<title>Nlaylist</title>

		<!-- external -->
		<script src="https://www.youtube.com/iframe_api" defer></script>

		<!-- internal -->
		<link rel="stylesheet" href="css/main.css">
		<link rel="stylesheet" href="css/toast.css">
		<script src="js/scoring.js"></script>
		<script src="js/nextpicker.js"></script>
		<script src="js/ranking.js"></script>
		<script src="js/list.js"></script>
		<script src="js/modl.js"></script>
		<script src="js/main.js"></script>
		<script src="js/toasts.js" async></script>
	</head>
	<body onload="onPageLoad()">
		<!-- Menu -->
		<div id="menu">
			<button onclick="loadFile()">Load from file</button>
			<button onclick="saveFile()">Save to file</button>
			<button onclick="addFromTextInput()">Add videos</button>
			<span><input type="checkbox" id="chkb_advctrls" onchange="toggleAdvancedControls()"/><label for="chkb_advctrls">Advanced controls</label></span>
			<button onclick="resetList()" class="advanced">Reset list</button>
			<select id="pickMode">
				<option value="meta" selected>- Any -</option>
				<option value="ordered">Top</option>
				<option value="similar_scores">Similar</option>
				<option value="weighted_random">Weighted</option>
				<option value="pure_random">Random</option>
			</select>
		</div>

		<!-- Players -->
		<div id="players"></div>

		<!-- Actions -->
		<div id="actions">
			<div id="leftactions">
				<button id="btn_lft2" class="btn3" onclick="choice('btn_lft2')" title="I prefer the left video, for sure">&lt;&lt;&lt;</button>
				<button id="btn_lft1" class="btn1" onclick="choice('btn_lft1')" title="I rather prefer the left video (may depend on my mood)">&lt;</button>
			</div>
			<div id="midactions">
				<button id="btn_eql" class="btn0" onclick="choice('btn_eql')" title="I do not prefer left or right video">=</button><br/>
				<button id="btn_skp" class="skp btns" onclick="skip()" title="Apply vote and show the next video">Next</button><br/>
				<div class="advanced">
					<button id="btn_mrg_lft" class="skp" onclick="mergeLeft()" title="Both video are the same: Remove the right one, and merge it into the left one">&lt; Merge &lt;</button>
					<button id="btn_del" class="skp" onclick="removeRight()" title="Remove the right video from the list">Delete ></button>
					<button id="btn_mrg_rgt" class="skp" onclick="mergeRight()" title="Both video are the same: Remove the left one, and merge it into the right one">> Merge ></button>
				</div>
			</div>
			<div id="rightactions">
				<button id="btn_rgt1" class="btn1" onclick="choice('btn_rgt1')" title="I rather prefer the right video (may depend on my mood)">></button>
				<button id="btn_rgt2" class="btn3" onclick="choice('btn_rgt2')" title="I prefer the right video, for sure">>>></button>
			</div>
		</div>

		<!-- Ranking -->
		<div id="rankingControls">
			<button id="rankingTop" onclick="setRankingMode('top')" title="Best videos first">Top</button>
			<button id="rankingHistory" onclick="setRankingMode('history')" title="Last picked videos first">History</button>
			<input id="rankingSearch" type="text" placeholder="Search" onkeydown="if(event.key === 'Enter') applyRankingSearch()"
				title="Search in video titles&#10;? : any character&#10;* : any characters&#10;- _ : space or underscore"/>
			<button onclick="clearRankingSearch()" title="Clear the search">×</button>
			<button onclick="applyRankingSearch()">Apply</button>
			<button id="goToLeft" onclick="goToPlayerVideo('left')" title="Show the page of the left video">Go to left</button>
			<button id="goToRight" onclick="goToPlayerVideo('right')" title="Show the page of the right video">Go to right</button>
			<select id="rankingPageSize" onchange="setRankingPageSize(Number(this.value))" title="Videos per page">
				<option value="10">10 per page</option>
				<option value="25" selected>25 per page</option>
				<option value="50">50 per page</option>
				<option value="100">100 per page</option>
				<option value="250">250 per page</option>
			</select>
			<div class="pagination">
				<button class="firstPage" onclick="goToRankingPage(1)" title="First page">«</button>
				<button class="previousPage" onclick="shiftRankingPage(-1)" title="Previous page">&lt;</button>
				<span class="pageNumber">Page 1/1</span>
				<button class="nextPage" onclick="shiftRankingPage(1)" title="Next page">&gt;</button>
				<button class="lastPage" onclick="goToRankingPage(Infinity)" title="Last page">»</button>
			</div>
		</div>
		<div id="ranking"></div>
		<div class="pagination">
			<button class="firstPage" onclick="goToRankingPage(1)" title="First page">«</button>
			<button class="previousPage" onclick="shiftRankingPage(-1)" title="Previous page">&lt;</button>
			<span class="pageNumber">Page 1/1</span>
			<button class="nextPage" onclick="shiftRankingPage(1)" title="Next page">&gt;</button>
			<button class="lastPage" onclick="goToRankingPage(Infinity)" title="Last page">»</button>
		</div>
	</body>
</html>
